{% extends "base.html" %}
{% block title %}로그인 | NovaStream{% endblock %}
{% block content %}
  <section class="page-shell narrow-shell auth-shell">
    <p class="eyebrow">MEMBER ACCESS</p>
    <h1>로그인</h1>
    <p class="page-intro">NovaStream 계정으로 로그인하세요.</p>

    {% if error %}
      <div class="filter-box"><strong>로그인 실패</strong><p>{{ error }}</p></div>
    {% endif %}

    <form class="auth-card" method="post">
      <label for="username">아이디</label>
      <input id="username" name="username" value="{{ username }}" autocomplete="username" required>
      <label for="password">비밀번호</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="button primary full-button" type="submit">로그인</button>
    </form>
    <p class="lab-note">격리된 실습 환경입니다. 실제 계정 정보를 입력하지 마세요.</p>
  </section>
{% endblock %}
