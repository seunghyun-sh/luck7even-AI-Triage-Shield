{% extends "base.html" %}
{% block title %}회원가입 · Lumi Market{% endblock %}
{% block content %}
  <section class="account-shell single"><div class="account-card"><p class="eyebrow dark">JOIN LUMI</p><h1>회원가입</h1><p class="muted">간단한 정보 입력으로 Lumi의 다양한 혜택을 만나보세요.</p>
    {% if error %}<div class="form-error">{{ error }}</div>{% endif %}
    <form method="post" class="stacked-form"><label for="username">아이디</label><input id="username" name="username" required><label for="display_name">이름</label><input id="display_name" name="display_name" required><label for="email">이메일</label><input id="email" name="email" type="email" required><label for="password">비밀번호</label><input id="password" name="password" type="password" required><button class="button primary wide" type="submit">가입하기</button></form>
    <div class="account-links"><span>이미 회원이신가요?</span><a href="{{ url_for('auth.login') }}">로그인</a></div>
  </div></section>
{% endblock %}
